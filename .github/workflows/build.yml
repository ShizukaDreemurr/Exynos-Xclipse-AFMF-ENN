name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner đã có sẵn Android SDK; chỉ cần chấp nhận license để AGP tự tải NDK/CMake.
      - name: Accept Android licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Không cần gradle-wrapper.jar: action tự cài Gradle 8.9
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Đưa lỗi lên annotation để đọc được mà không cần tải log.
            msg=$(grep -E "^e: |error:|warning: .*unresolved|FAILED|What went wrong|Execution failed|Caused by|> .*(not found|No such|Could not|Failed)" build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: fluidframes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
