name: Build APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o Exynos-Xclipse-AFMF-ENN-2.1-MaxFPS-2600.zip
          if [ -d Exynos-Xclipse-AFMF-ENN-feat-initial-import ]; then
            shopt -s dotglob
            mv Exynos-Xclipse-AFMF-ENN-feat-initial-import/* .
            rmdir Exynos-Xclipse-AFMF-ENN-feat-initial-import || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable / create wrapper if needed
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.7 || true
            chmod +x gradlew || true
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
