name: Build APK from Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          set -e
          unzip -o Exynos-Xclipse-AFMF-ENN-2.1-MaxFPS-2600.zip
          SRC="Exynos-Xclipse-AFMF-ENN-feat-initial-import"
          if [ -d "$SRC" ]; then
            shopt -s dotglob nullglob
            for item in "$SRC"/*; do
              base=$(basename "$item")
              if [ "$base" = ".github" ]; then
                # giữ workflow hiện tại, chỉ copy thêm nếu có
                mkdir -p .github/workflows
                cp -rn "$item"/workflows/* .github/workflows/ 2>/dev/null || true
              else
                rm -rf "./$base"
                mv "$item" .
              fi
            done
            rm -rf "$SRC"
          fi
          echo "=== root after unzip ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.7 || true
            chmod +x gradlew 2>/dev/null || true
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
