name: Probe LiteRT/Samsung
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir -p p && cd p
          emit() { # title file
            msg=$(head -c 40000 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$1::${msg}"
          }
          git clone --depth 1 -q https://github.com/google-ai-edge/LiteRT.git lr 2>&1 | tail -2
          cd lr
          find . -ipath '*samsung*' -o -ipath '*exynos*' | grep -v '/\.git/' | head -120 > ../files.txt
          emit "samsung-files" ../files.txt
          grep -rIl -i "exynos\|litecore\|samsung" --include=WORKSPACE --include=*.bzl --include=*.bazel --include=*.md --include=*.sh --include=*.bazelrc --include=.bazelrc . 2>/dev/null | head -60 > ../refs.txt
          emit "samsung-refs" ../refs.txt
          for f in $(find litert/vendors/samsung -name 'README*' 2>/dev/null | head -3); do emit "readme-$f" $f; done
          grep -rn -i "exynos_ai_litecore\|EXYNOS_AI_LITECORE\|litecore" WORKSPACE third_party .bazelrc 2>/dev/null | head -40 > ../ws.txt
          emit "workspace-litecore" ../ws.txt
