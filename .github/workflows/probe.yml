name: Probe LiteRT/Samsung
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir -p p && cd p
          emit() { # title file
            msg=$(head -c 40000 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$1::${msg}"
          }
          git clone --depth 1 -q https://github.com/google-ai-edge/LiteRT.git lr 2>&1 | tail -2
          cd lr
          emit "cmake-doc" docs/instructions/CMAKE_BUILD_INSTRUCTIONS.md
          emit "samsung-dispatch-cmake" litert/vendors/samsung/dispatch/CMakeLists.txt
          emit "samsung-cmake" litert/vendors/samsung/CMakeLists.txt
          grep -n -i "samsung\|exynos\|VENDOR\|NPU" CMakeLists.txt litert/CMakeLists.txt litert/vendors/CMakeLists.txt 2>/dev/null | head -40 > ../cm.txt
          emit "cmake-vendor-opts" ../cm.txt
          ls cmake_example docker_build >> ../cm.txt; ls litert/cmake* 2>/dev/null >> ../cm.txt
          emit "ls-cmake" ../cm.txt
