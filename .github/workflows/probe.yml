name: Probe LiteRT/Samsung
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir -p p && cd p
          emit() { # title file
            msg=$(head -c 40000 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$1::${msg}"
          }
          git clone --depth 1 -q https://github.com/google-ai-edge/LiteRT.git lr 2>&1 | tail -2
          cd lr
          cat .bazelversion > ../bzl.txt; grep -n "android" .bazelrc | head -60 >> ../bzl.txt; ls >> ../bzl.txt
          emit "bazelrc" ../bzl.txt
          grep -n -i -B3 -A10 "samsung\|exynos" ci/build_pip_package_with_bazel.sh > ../pip.txt
          emit "ci-pip" ../pip.txt
          cat ci/tools/python/vendor_sdk/samsung/setup.py ci/tools/python/vendor_sdk/samsung/ai_edge_litert_sdk_samsung/__init__.py > ../sdkpy.txt
          emit "sdk-python" ../sdkpy.txt
          find . -path ./third_party -prune -o -ipath '*aot*' -ipath '*samsung*' -print > ../aot.txt
          find litert/python -ipath '*samsung*' >> ../aot.txt
          emit "aot-files" ../aot.txt
          grep -rn -i "android_arm64" README.md docs g3doc 2>/dev/null | head -20 > ../doc.txt
          emit "docs-android" ../doc.txt
          ls litert/vendors/samsung/ litert/vendors/samsung/schema >> ../doc.txt 2>&1
          emit "samsung-ls" ../doc.txt
          grep -n -i "dlopen\|libenn\|\.so" litert/vendors/samsung/dispatch/enn_manager.cc | head -20 > ../enn.txt
          emit "enn-so" ../enn.txt
