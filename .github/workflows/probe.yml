name: Probe LiteRT/Samsung
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir -p p && cd p
          emit() { # title file
            msg=$(head -c 40000 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$1::${msg}"
          }
          git clone --depth 1 -q https://github.com/google-ai-edge/LiteRT.git lr 2>&1 | tail -2
          cd lr
          ls litert/vendors/samsung/compiler/builders | grep -v BUILD | sed 's/_op_builder.*//' | sort -u | tr '\n' ' ' > ../ops.txt
          emit "builders" ../ops.txt
          emit "samsung-kotlin-readme" litert/samples/image_segmentation/kotlin_npu/android/README.md
          grep -n -i -B2 -A12 "samsung\|exynos" litert/runtime/dispatch/README.md > ../disp.txt
          emit "dispatch-readme" ../disp.txt
          emit "enn_type.h" litert/vendors/samsung/dispatch/enn_type.h
          emit "enn_manager.cc" litert/vendors/samsung/dispatch/enn_manager.cc
          emit "dispatch-BUILD" litert/vendors/samsung/dispatch/BUILD
          emit "samsung_build_defs" litert/vendors/samsung/samsung_build_defs.bzl
          emit "exynos-BUILD" third_party/exynos_ai_litecore/exynos_ai_litecore.BUILD
          emit "litecore-workspace" third_party/exynos_ai_litecore/workspace.bzl
