name: aot-compile-model
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/aot-model.yml', 'models/make_test_model.py', 'models/make_quant_models.py', 'models/calib/**', 'models/ifrnet_coarse.py', 'models/op_probes.py', 'models/weights/**']
permissions:
  contents: write
jobs:
  aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install tensorflow-cpu numpy torch > /tmp/pip1.log 2>&1 || { echo "::error title=pip1::$(tail -c 600 /tmp/pip1.log | tr '\n' ' ')"; exit 1; }
          (pip install 'ai-edge-litert==2.3.0' && pip install --no-deps ai-edge-litert-sdk-samsung-nightly) > /tmp/pip2.log 2>&1 || { echo "::error title=pip2::$(tail -c 900 /tmp/pip2.log | tr '\n' ' ')"; exit 1; }
          ls $(python -c "import ai_edge_litert,os;print(os.path.dirname(ai_edge_litert.__file__))")/vendors/samsung/compiler 2>&1 | head -3 | tr "\n" " " > /tmp/plug.txt; echo "::notice title=plugin::$(cat /tmp/plug.txt)"
          echo "::notice title=pip::$(pip list 2>/dev/null | grep -i -E 'litert|tensorflow' | tr '\n' ' ')"
      - name: Flatbuffers shim (wheel plugin misses a symbol)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libflatbuffers2 > /dev/null 2>&1 || sudo apt-get install -y -qq libflatbuffers-dev > /dev/null 2>&1
          f=$(ls /usr/lib/x86_64-linux-gnu/libflatbuffers.so* 2>/dev/null | head -1)
          echo "::notice title=shim::$f $(nm -D $f 2>/dev/null | grep -c ClassicLocale)"
          echo "SHIM=$f" >> $GITHUB_ENV
      - name: Build + AOT compile
        working-directory: models
        run: |
          LD_PRELOAD=$SHIM python make_test_model.py --compile --ifr weights/IFRNet_S_Vimeo90K.pth > /tmp/aot.log 2>&1 || { echo "::error title=aot::$(tr "\r" "\n" < /tmp/aot.log | grep -E "AOTERR|error|Error|ERROR|fail|Fail|unsupported|Unsupported|not " | grep -v "it/s" | tail -c 2500 | tr '\n' ' ')"; exit 1; }
          echo "::notice title=aotlog::$(tail -c 800 /tmp/aot.log | tr '\n' ' ')"
          find out_models -name '*.tflite' | xargs ls -l | awk '{print $5" "$9}' | tr '\n' ';' > /tmp/files.txt
          echo "::notice title=files::$(cat /tmp/files.txt)"
      - name: Op probes (gather/warp có chạy trên NPU không)
        working-directory: models
        continue-on-error: true
        run: |
          LD_PRELOAD=$SHIM python op_probes.py > /tmp/ops.log 2>&1 || true
          echo "::notice title=opprobe::$(tr "\r" "\n" < /tmp/ops.log | grep OPRESULT | cut -c1-420 | tr '\n' '|')"
      - name: Quantized models (FP16 / INT8 hiệu chuẩn bằng gameplay)
        working-directory: models
        continue-on-error: true
        run: |
          pip install -q opencv-python-headless > /dev/null 2>&1 || true
          LD_PRELOAD=$SHIM python make_quant_models.py --ifr weights/IFRNet_S_Vimeo90K.pth --compile > /tmp/q.log 2>&1 || true
          echo "::notice title=quant::$(tr "\r" "\n" < /tmp/q.log | grep QRESULT | cut -c1-200 | tr '\n' '|')"
      - name: Publish compiled models
        if: success()
        run: |
          mkdir -p /tmp/pm/models && cd models
          for n in 192 256 320 384 480 640 960 1280 probe_nchw probe_nhwc; do f=$(find out_models/c$n -name '*Samsung*' -name '*.tflite' | head -1); [ -n "$f" ] && cp "$f" /tmp/pm/models/flow_$n.tflite; done
          for n in op_resize op_gather op_gather_warp op_gather_nd op_shift25 op_gwarp_640 op_gwarp_960 op_gwarp_1280; do f=$(find out_ops/c_${n}_1 out_ops/c_${n}_0 -name '*Samsung*' -name '*.tflite' 2>/dev/null | head -1); [ -n "$f" ] && cp "$f" /tmp/pm/models/flow_$n.tflite; done
          for n in 192 256 320 384 480 640 960 1280; do for k in fp16 int8; do f=$(find out_quant/c${n}_${k} -name '*Samsung*' -name '*.tflite' 2>/dev/null | head -1); [ -n "$f" ] && cp "$f" /tmp/pm/models/flow_${n}_${k}.tflite; done; done
          ls -l /tmp/pm/models
          cd /tmp/pm && git init -q && git checkout -q -b prebuilt-models
          git config user.name ci; git config user.email ci@example.com
          git add -f models && git commit -qm "compiled models" 
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          out=$(git push -f origin prebuilt-models 2>&1); rc=$?
          echo "::notice title=publish::rc=$rc $(echo $out | tail -c 300)"; exit $rc
