name: build-samsung-npu-dispatch
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/npu-dispatch.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Probe LiteCore download
        run: |
          for v in 1.2.1 1.1.0; do
            code=$(curl -sS -o /tmp/lc.tgz -w '%{http_code} %{size_download}' -L --max-time 120 "https://soc-developer.semiconductor.samsung.com/api/v1/resource/download-file/ai-litecore-ubuntu2404-v$v.tar.gz" || true)
            echo "::notice title=litecore $v::$code"
          done
      - name: Clone LiteRT
        run: git clone --depth 1 https://github.com/google-ai-edge/LiteRT.git
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang ninja-build python3-pip
          pip3 install --break-system-packages cmake==3.28.3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
      - name: Configure host tools
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        working-directory: LiteRT/litert
        run: cmake --preset android-arm64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLITERT_ENABLE_SAMSUNG=ON > ../../cfg1.log 2>&1 || { echo "::error title=cfg1::$(tail -c 900 ../../cfg1.log | tr '\n' ' ')"; exit 1; }
      - name: Configure android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        working-directory: LiteRT/litert
        run: |
          HOST_DIR="$(cd ../host_flatc_build/_deps/flatbuffers-build 2>/dev/null && pwd || true)"
          cmake --preset android-arm64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLITERT_ENABLE_SAMSUNG=ON ${HOST_DIR:+-DTFLITE_HOST_TOOLS_DIR=$HOST_DIR} > ../../cfg2.log 2>&1 || { echo "::error title=cfg2::$(tail -c 900 ../../cfg2.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=samsung cfg::$(grep -i -E 'samsung|litecore' ../../cfg2.log | tr '\n' ' ' | head -c 700)"
      - name: Build
        working-directory: LiteRT/litert
        run: |
          cmake --build cmake_build_android_arm64 --target dispatch_api_samsung_so samsung_compiler_plugin --parallel 3 > ../../build.log 2>&1 || { echo "::error title=build::$(tail -c 300 ../../build.log | tr "\n" " ") ## $(grep -E "error|Error" ../../build.log | tail -6 | tr '\n' ' ' | head -c 900)"; exit 1; }
      - name: Collect
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          find LiteRT/litert/cmake_build_android_arm64 \( -name 'libLiteRtDispatch_Samsung.so' -o -name 'libLiteRtCompilerPlugin*.so' -o -name 'libsamsung_compiler_plugin*.so' -o -name 'libLiteRt.so' \) | tee libs.txt
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d $(head -1 libs.txt) | grep NEEDED | tr '\n' ' ' > needed.txt || true
          echo "::notice title=needed::$(cat needed.txt)"
          echo "::notice title=libs::$(cat libs.txt | tr '\n' ' ')"
          mkdir -p out && while read f; do cp "$f" out/; done < libs.txt
      - name: Publish prebuilt libs to branch
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p /tmp/pub/prebuilt/arm64-v8a /tmp/pub/prebuilt/extra
          cp out/libLiteRtDispatch_Samsung.so out/libLiteRtCompilerPlugin_Samsung.so /tmp/pub/prebuilt/arm64-v8a/
          cp out/libLiteRt.so /tmp/pub/prebuilt/extra/
          S=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          for f in /tmp/pub/prebuilt/*/*.so; do $S --strip-unneeded "$f"; done
          sizes=$(ls -l /tmp/pub/prebuilt/*/*.so | awk '{print $5" "$9}' | tr '\n' ';')
          cd /tmp/pub && git init -q && git checkout -q -b prebuilt-npu
          git config user.name ci; git config user.email ci@example.com
          git add -f prebuilt && git commit -qm "prebuilt Samsung NPU libs"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          out=$(git push -f origin prebuilt-npu 2>&1); rc=$?
          echo "::notice title=publish::rc=$rc sizes=$sizes $(echo $out | tail -c 500)"
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: samsung-npu-dispatch
          path: out/
